<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 6</title>
</head>
<style>
    .container {
        border: 3px solid black;
        padding: 40px;
        width: 600px;
        text-align: center;
        position: relative;
    }
    img {
        width: 100px;
        height: 100px;
        background-color: dodgerblue;
        position: fixed;
        left: 50px;
    }

    span {
        font-size: 20px;
        vertical-align: top;
    }
    .item1 {
        width: 150px;
        height: 150px;
        background-color: rgba(0, 0, 255);
        display: inline-block; 
        position: relative;
        left: 130px; 
        top: 30px;
        z-index: 2;

    }
    .item2{
        width: 150px;
        height: 150px;
        background-color: rgba(255, 0, 0);
        display: inline-block;
        position: absolute;
        right: 0px;
        z-index: 1;
    }
</style>

<body>
    <div class="container">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.
            Laudantium repellat laborum veniam minus tenetur nisi assumenda iusto alias accusantium,
            nemo voluptas quo maiores laboriosam? Dolore beatae tempora enim deleniti! Odit!</p>
    <button>lorem</button>
    <div>
        <img>
        <span>Exemplo vertical-align</span>
    </div>
    <div class="item1">item1</div>
    <div class="item2">item2</div>
    </div>
</body>

</html>

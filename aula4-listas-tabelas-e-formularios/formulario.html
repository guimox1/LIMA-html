<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <section>
        <h2>formulário</h2>
        <form action="cadastro.php" method="post">
            <p><label>Nome:</label>
            <input type="text" name="nome" placeholder="Digite seu nome" required>
        </p>

        <p><label>Senha:</label>
            <input type="password" name="senha" placeholder="Digite sua senha" maxlength="8" required>
        </p>

        <p><label>telefone:</label>
            <input type="text" name="telefone" pattern="\([0-9]{2}\ [0-9]{5}-[0-9]{4})" placeholder="(99) 99999-9999" required title="use o formato (99) 99999-9999">
        </p>

        <p><label>email:</label>
            <input type="email" name="email" placeholder="Digite seu email" required>
        </p>
        <p><label>CEP:</label>
            <input type="text" name="CEP" placeholder="Digite seu CEP" required>
        </p>
        <p><label>Sobre você:</label>
            <textarea name="bio" rows="10" cols="100"></textarea>
        </p>
        <p><label>Gênero:</label>
            <input type="radio" name="genero" value="M">Masculino
            <input type="radio" name="genero" value="F">Feminino
        </p>
        <p><label>Interesses:</label>
        <input type="checkbox" name="interesses" value="tecnologia">tecnologia
        <input type="checkbox" name="interesses" value="esportes">esportes
        <input type="checkbox" name="interesses" value="artes">artes
        </p>
        <p><label>País:</label>
        <select name="pais">
            <option value="">---</option>
            <option value="Brasil">Brasil</option>
            <option value="Argentina">Argentina</option>
            <option value="Chile">Chile</option>
        </select>
        </p>
        <p><label>Foto de Perfil</label>
            <input type="file" name="foto">
        </p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
    </section>
</body>
</html>
